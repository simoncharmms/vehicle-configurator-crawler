name: Daily Vehicle Configurator Crawl

on:
  schedule:
    # 6:00 AM CET (Europe/Berlin) = 5:00 AM UTC (winter) / 4:00 AM UTC (summer)
    # Using 4:00 AM UTC to cover CEST (summer time)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      brands:
        description: 'Brands to crawl (comma-separated, empty = all)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run crawler
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BRANDS_ARG=""
          if [ -n "${{ github.event.inputs.brands }}" ]; then
            IFS=',' read -ra BRANDS <<< "${{ github.event.inputs.brands }}"
            BRANDS_ARG="--brands ${BRANDS[*]}"
          fi
          python -m crawler.orchestrator $BRANDS_ARG --verbose

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Vehicle Crawler Bot"
          git config user.email "crawler@users.noreply.github.com"
          git add data/
          git commit -m "📊 Crawl data $(date +%Y-%m-%d)"
          git push

  deploy-dashboard:
    needs: crawl
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest data
        run: git pull origin main || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build dashboard artifact
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp -r data _site/data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
