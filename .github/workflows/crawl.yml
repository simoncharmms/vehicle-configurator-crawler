name: Daily Vehicle Configurator Crawl

on:
  schedule:
    # 6:00 AM CET (Europe/Berlin) = 5:00 AM UTC (winter) / 4:00 AM UTC (summer)
    # Using 4:00 AM UTC to cover CEST (summer time)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      brands:
        description: 'Brands to crawl (comma-separated, empty = all)'
        required: false
        default: ''

concurrency:
  group: vehicle-configurator-crawl-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run crawler
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRANDS_INPUT: ${{ github.event.inputs.brands || '' }}
        run: |
          if [ -n "$BRANDS_INPUT" ]; then
            IFS=',' read -ra RAW_BRANDS <<< "$BRANDS_INPUT"
            BRANDS=()
            for brand in "${RAW_BRANDS[@]}"; do
              brand="$(printf '%s' "$brand" | xargs)"
              if ! [[ "$brand" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
                echo "Invalid brand input: $brand" >&2
                exit 1
              fi
              BRANDS+=("$brand")
            done
            python -m crawler.orchestrator --brands "${BRANDS[@]}" --verbose
          else
            python -m crawler.orchestrator --verbose
          fi

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update crawl data $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} lost a race; retrying against the latest main"
          done
          echo "Unable to push crawl data after 3 attempts" >&2
          exit 1

  deploy-dashboard:
    needs: crawl
    runs-on: ubuntu-latest
    if: ${{ always() && github.repository_visibility == 'public' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Pull latest data
        run: git pull origin main || true

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - name: Build dashboard artifact
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp -r data _site/data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
